function resize(){const r=host.getBoundingClientRect();if(!r.width||!r.height)return false;const w=Math.round(r.width),h=Math.round(r.height),pr=renderer.getPixelRatio();const cv=renderer.domElement;if(cv.width!==Math.round(w*pr)||cv.height!==Math.round(h*pr)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}return true;}
new ResizeObserver(resize).observe(host);
let wasHidden=true;
const ease=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function loop(now){
  requestAnimationFrame(loop);
  if(!resize()){wasHidden=true;return;}
  if(wasHidden){wasHidden=false;start=now;}
  if(ready){
    const t=(now-start)/1000,u=ease((t-.3)/4.2),x=-halfX-.02+(2*halfX+.04)*u;
    clip.constant=x;glow.position.x=x;rimLine.position.x=x;
    const sweeping=u>0&&u<1;glow.visible=rimLine.visible=sweeping;
    if(u>=1){clip.constant=1e3;if(!userStop)controls.autoRotate=true;ph.textContent=skinOn?'Structure with skin':'Primary structure';sub.textContent='Drag to inspect · auto-rotating';}
    else{ph.textContent='Revealing structure';sub.textContent=`CATIA STL · ${n.toLocaleString()} facets`;}
    const target=skinOn&&exTarget<.01&&explode<.02?ease((t-4.8)/1.8)*.3:0;if(explode>.02)skinMat.opacity=Math.min(skinMat.opacity,.3*(1-Math.min(1,explode*8)));skinMat.opacity+=(target-skinMat.opacity)*.12;skinEdge.opacity=skinMat.opacity*1.2;skinGroup.visible=skinMat.opacity>.005;
  }
  if(ready){
    explode+=(exTarget-explode)*.12;grp.forEach(g=>g.position.copy(g.userData.off).multiplyScalar(explode));
    if(tween){const k=ease((now-tween.t0)/800);const d=tween.from.length();camera.position.lerpVectors(tween.from,tween.to,k).setLength(d);if(k>=1)tween=null;}
    const rr=host.getBoundingClientRect(),show=labelsOn&&clip.constant>100;
    const ctr=new THREE.Vector3(0,0,0).project(camera),cx=(ctr.x+1)/2*rr.width,cy=(1-ctr.y)/2*rr.height,L=rr.width<640?34:56;
    lbs.forEach(l=>{tmpV.copy(l.p).add(grp[l.gi].position).project(camera);const vis=show&&tmpV.z<1;const ax=(tmpV.x+1)/2*rr.width,ay=(1-tmpV.y)/2*rr.height;
      let dx=ax-cx,dy=ay-cy;const nn=Math.hypot(dx,dy)||1;dx/=nn;dy/=nn;const lx=ax+dx*L,ly=ay+dy*L;
      l.d.style.opacity=vis?1:0;l.d.style.left=lx+'px';l.d.style.top=ly+'px';
      l.ln.setAttribute('x1',ax);l.ln.setAttribute('y1',ay);l.ln.setAttribute('x2',lx);l.ln.setAttribute('y2',ly);l.dot.setAttribute('cx',ax);l.dot.setAttribute('cy',ay);
      l.ln.style.opacity=l.dot.style.opacity=vis?1:0;});
    const dist=camera.position.length(),want=baseDist*(1+.55*explode);if(!tween&&Math.abs(dist-want)>.001&&(Math.abs(exTarget-explode)>.001))camera.position.setLength(want);
    sheetMat.opacity=.3*(1-Math.min(1,explode*8));sheetMat.visible=sheetMat.opacity>.005;
  }
  controls.update();renderer.render(scene,camera);
}
const tmpV=new THREE.Vector3();
requestAnimationFrame(loop);
</script>
