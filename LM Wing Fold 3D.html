<!doctype html>
<html lang="en">
<head>
<script src="viewer-perf.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loitering munition — wing fold</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9"
  }
}
</script>
<style>
  html,body{height:100%;margin:0;background:#0d0f11;overflow:hidden}
  #view{position:absolute;inset:0}
  #view canvas{display:block;width:100%;height:100%;touch-action:none}
  .lbl{position:absolute;font:11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;user-select:none}
  #hint{left:16px;bottom:14px;color:#6c757e}
  #state{left:16px;top:16px;color:#e8eaed;display:flex;gap:10px;align-items:center}
  #bar{width:64px;height:2px;background:#2a2e33;position:relative}
  #bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent,#ff8a3d)}
  #btn{position:absolute;right:14px;top:12px;font:11px/1 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;
       color:#c3c7cd;background:transparent;border:1px solid #2a2e33;padding:8px 10px;cursor:pointer}
  #btn:hover{color:#fff;border-color:#6c757e}
  #load{position:absolute;inset:0;display:grid;place-items:center;color:#6c757e}
</style>
</head>
<body>
<div id="view"></div>
<p id="load" class="lbl">Loading model…</p>
<p id="state" class="lbl"><span id="stxt">Deployed</span><span id="bar"><i></i></span></p>
<button id="btn">Pause</button>
<p id="hint" class="lbl">Drag to rotate · scroll to zoom</p>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const NAMES = ['body','motor','props','vtail','rearL','rearR','frontL','frontR','pin'];
const buf = await (await fetch('lm-model-v2.mesh')).arrayBuffer();
const dv = new DataView(buf);
let off = 0; const u32 = () => { const v = dv.getUint32(off, true); off += 4; return v; };
const count = u32();
const parts = [];
for (let i = 0; i < count; i++) {
  const pid = u32(), nv = u32(), ni = u32();
  const pn = nv * 3 + (nv * 3) % 2;
  const P = new Int16Array(buf.slice(off, off + pn * 2)); off += pn * 2;
  const nn = nv * 3 + (4 - (nv * 3) % 4) % 4;
  const N = new Int8Array(buf.slice(off, off + nn)); off += nn;
  const I = new Uint32Array(buf.slice(off, off + ni * 4)); off += ni * 4;
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3);
  for (let k = 0; k < nv * 3; k++) { pos[k] = P[k] / 10000; nor[k] = N[k] / 127; } // 0.1 mm → m
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3)); // exact CAD surface normals
  g.setIndex(new THREE.BufferAttribute(I, 1));
  if (NAMES[pid] === 'body') { g.normalizeNormals(); }
  parts.push({ name: NAMES[pid], g });
}

const S = THREE.DoubleSide;
const mat = {
  body:  new THREE.MeshStandardMaterial({ color: 0xc9ccc9, roughness: .55, metalness: .05, side: S, shadowSide: S }),
  wing:  new THREE.MeshStandardMaterial({ color: 0xe6e7e3, roughness: .5, metalness: .02, side: S, shadowSide: S }),
  motor: new THREE.MeshStandardMaterial({ color: 0x3b4046, roughness: .35, metalness: .8, side: S, shadowSide: S }),
  props: new THREE.MeshStandardMaterial({ color: 0xff8a3d, roughness: .45, metalness: .1, side: S, shadowSide: S }),
  pin:   new THREE.MeshStandardMaterial({ color: 0xff8a3d, roughness: .4, metalness: .5, side: S, shadowSide: S })
};
// split the prop into hub + two blades by triangle centroid (blades run along ±Y)
function splitProps(g) {
  const pos = g.attributes.position.array, idx = g.index.array, out = { hub: [], propR: [], propL: [] };
  for (let t = 0; t < idx.length; t += 3) {
    const cy = (pos[idx[t] * 3 + 1] + pos[idx[t + 1] * 3 + 1] + pos[idx[t + 2] * 3 + 1]) / 3;
    (cy > 0.03 ? out.propR : cy < -0.03 ? out.propL : out.hub).push(idx[t], idx[t + 1], idx[t + 2]);
  }
  return Object.entries(out).map(([k, list]) => {
    const ng = new THREE.BufferGeometry();
    ng.setAttribute('position', g.attributes.position); ng.setAttribute('normal', g.attributes.normal);
    ng.setIndex(list); return { name: k === 'hub' ? 'props' : k, g: k === 'hub' ? ng : ng.clone(), mat: 'props' };
  });
}
let vt = 0;
const expanded = [];
for (const p of parts) {
  if (p.name === 'props') expanded.push(...splitProps(p.g));
  else if (p.name === 'vtail') expanded.push({ name: vt++ ? 'finR' : 'finL', g: p.g });
  else expanded.push(p);
}
const matFor = n => n === 'body' ? mat.body : n === 'motor' ? mat.motor : n === 'props' ? mat.props : n === 'pin' ? mat.pin : mat.wing;

// CAD frame: X aft, Y starboard, Z up (m). Hinges derived from the STEP geometry.
// rear wings sweep forward, front wings sweep aft (about Z); twin fins fold forward flat along the fuselage sides (about Y);
// prop blades fold backward, aft of the hub (about Z).
const H = Math.PI / 2;
const JOINT = {
  rearL:  { p: [0.730, -0.003, 0], ax: 'z', a: -H },
  rearR:  { p: [0.730, -0.003, 0], ax: 'z', a:  H },
  frontL: { p: [-0.332, -0.003, 0], ax: 'z', a:  H },
  frontR: { p: [-0.332, -0.003, 0], ax: 'z', a: -H },
  finL:   { p: [0.788, 0, 0.040], ax: 'y', a: -H },
  finR:   { p: [0.788, 0, 0.040], ax: 'y', a: -H },
  propL:  { p: [1.000, -0.030, 0.075], ax: 'z', a:  H * 0.97 },
  propR:  { p: [1.000,  0.030, 0.075], ax: 'z', a: -H * 0.97 }
};
const model = new THREE.Group();
const wings = {};
for (const p of expanded) {
  const m = new THREE.Mesh(p.g, p.mat ? mat[p.mat] : matFor(p.name));
  m.castShadow = m.receiveShadow = true;
  const j = JOINT[p.name];
  if (j) {
    p.g.translate(-j.p[0], -j.p[1], -j.p[2]);
    const pivot = new THREE.Group(); pivot.position.set(...j.p); pivot.add(m);
    pivot.userData.base = new THREE.Vector3(...j.p);
    model.add(pivot); wings[p.name] = pivot;
  } else model.add(m);
}

const root = new THREE.Group();
root.rotation.x = -Math.PI / 2; // Z-up → Y-up
root.add(model);
const box = new THREE.Box3().setFromObject(root);
const centre = box.getCenter(new THREE.Vector3());
root.position.sub(centre);
const radius = box.getSize(new THREE.Vector3()).length() * 0.5;

const host = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f11);
scene.add(root);
scene.add(new THREE.HemisphereLight(0xcfe0f0, 0x27313a, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(2.2, 3.2, 1.8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0006;
const d = radius * 1.2;
Object.assign(key.shadow.camera, { left: -d, right: d, top: d, bottom: -d, near: 0.1, far: 12 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xff9a5e, 0.9); rim.position.set(-2.6, 1.0, -2.2); scene.add(rim);
const fill = new THREE.DirectionalLight(0x9fc0ff, 0.7); fill.position.set(-1.2, -1.4, 2); scene.add(fill);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: .35 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = box.min.y - centre.y - 0.02; ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(6, 30, new THREE.Color(0x1f2429).lerp(new THREE.Color(window.ACCENT || 0x1f2429), .35), new THREE.Color(0x171b1f).lerp(new THREE.Color(window.ACCENT || 0x171b1f), .18));
grid.position.y = ground.position.y + 0.001; scene.add(grid);

const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
camera.position.set(radius * 1.9, radius * 1.55, radius * 2.3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = radius * 1.2; controls.maxDistance = radius * 6;
controls.autoRotate = true; controls.autoRotateSpeed = 0.6;

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.zoom = w / h < 1.2 ? 0.75 : 1;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host); resize();
document.getElementById('load').remove();

// timeline (s): deployed hold → fold → stowed hold → spring deploy
const T = { hold1: 2.4, fold: 2.0, hold2: 1.8, deploy: 1.3 };
const CYCLE = T.hold1 + T.fold + T.hold2 + T.deploy;
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c = 1.4; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const clamp = t => Math.min(1, Math.max(0, t));
// port wings step one skin-thickness out of plane so the folded pair stack instead of intersecting
const STACK = { rearL: -0.017, frontL: 0.017 };
const LAG = { propL: 0, propR: 0, finL: .12, finR: .12, rearL: .24, rearR: .24, frontL: .36, frontR: .36 };
const MAXLAG = .36;
function foldAt(t, lag) {           // 0 = deployed, 1 = stowed
  if (t < T.hold1 + lag) return 0;
  if (t < T.hold1 + T.fold) return easeIO(clamp((t - T.hold1 - lag) / (T.fold - MAXLAG)));
  const t2 = t - T.hold1 - T.fold - T.hold2;
  if (t2 < lag) return 1;
  return 1 - easeBack(clamp((t2 - (MAXLAG - lag)) / (T.deploy - MAXLAG)));
}

const stxt = document.getElementById('stxt'), barI = document.querySelector('#bar i');
const btn = document.getElementById('btn');
let paused = false, clock = 0, last = performance.now();
btn.onclick = () => { paused = !paused; btn.textContent = paused ? 'Play' : 'Pause'; };
document.addEventListener('visibilitychange', () => { last = performance.now(); });

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) clock = (clock + dt) % CYCLE;
  let avg = 0;
  for (const n in wings) { const f = foldAt(clock, LAG[n]); const j = JOINT[n], w = wings[n]; w.rotation[j.ax] = j.a * f; w.position.z = w.userData.base.z + (STACK[n] || 0) * Math.min(1, f * 3); avg += f / 8; }
  const c = clock;
  stxt.textContent = c < T.hold1 ? 'Deployed' : c < T.hold1 + T.fold ? 'Folding for tube stow' : c < T.hold1 + T.fold + T.hold2 ? 'Stowed' : 'Deploying';
  barI.style.width = (100 * (1 - Math.min(1, Math.max(0, avg)))) + '%';
  controls.autoRotate = !paused;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
